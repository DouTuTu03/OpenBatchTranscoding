name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    # 刻意不设 PYTHONUTF8 / PYTHONIOENCODING：windows-latest 的 stdout 是
    # cp1252，正好持续验证"非 UTF-8 控制台上输出不崩、管道里仍是真 UTF-8"
    # 这条约束（tests/test_cli.py 的 TestLegacyConsole 也覆盖它）。
    # 设成 UTF-8 能让 CI 立刻变绿，但会把这个类别的 bug 永久遮住。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 内核零依赖，测试也只用标准库；不装任何东西就能跑
      - name: 单元测试（标准库 unittest）
        run: python -m unittest discover -s tests -t .

      # 13 份真实字节语料，判定不符即以退出码 1 失败
      - name: 编码判定回归
        run: python scripts/make_samples.py

      # 自举：这个仓库自己的源码必须过它自己的门禁。
      # 输入直接来自版本控制（--stdin），所以新增文件不会漏检，也不必维护路径列表。
      # core.quotepath=false 避免非 ASCII 路径被转义成八进制。
      # 这一条同时验证了 ——expect / --eol 门禁在 3.9 与 3.13 上行为一致
      - name: 自举门禁（源码必须 UTF-8 + LF）
        shell: bash
        run: |
          export PYTHONPATH=src
          git -c core.quotepath=false ls-files \
            | python -m obt check --stdin --expect utf-8 --eol lf
